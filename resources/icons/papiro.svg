<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente principal do papel -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f4f8;stop-opacity:1" />
    </linearGradient>
    <!-- Gradiente da dobra -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8edf2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d8e0;stop-opacity:1" />
    </linearGradient>
    <!-- Gradiente azul accent (tema) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007acc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005a9e;stop-opacity:1" />
    </linearGradient>
    <!-- Gradiente cursor -->
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#007acc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005a9e;stop-opacity:1" />
    </linearGradient>
    <!-- Sombra suave -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <!-- Brilho sutil no papel -->
    <linearGradient id="paperHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Sombra do papel -->
  <rect x="34" y="28" width="188" height="204" rx="10" fill="#000000" opacity="0.08" filter="url(#dropShadow)"/>

  <!-- Papel principal -->
  <rect x="32" y="24" width="192" height="208" rx="10" fill="url(#paperGrad)" stroke="#c8d0d8" stroke-width="1.5"/>

  <!-- Brilho superior do papel -->
  <rect x="34" y="26" width="188" height="40" rx="8" fill="url(#paperHighlight)"/>

  <!-- Dobra do canto superior direito -->
  <path d="M184 24 L184 72 L224 24 Z" fill="url(#foldGrad)" stroke="#c8d0d8" stroke-width="1.5"/>
  <path d="M184 48 L208 24" stroke="#b8c0c8" stroke-width="1" opacity="0.5"/>

  <!-- Linhas de texto (estilo código) -->
  <g stroke="#3a3f4a" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <!-- Linha 1: comentário -->
    <g stroke="#6a7a8a" stroke-width="1.5">
      <line x1="56" y1="64" x2="80" y2="64"/>
      <line x1="84" y1="64" x2="140" y2="64"/>
    </g>
    <!-- Linha 2: código com chaves -->
    <g stroke="#3a3f4a" stroke-width="2">
      <line x1="56" y1="100" x2="120" y2="100"/>
      <line x1="124" y1="100" x2="132" y2="100"/>
      <line x1="136" y1="100" x2="180" y2="100"/>
    </g>
    <!-- Linha 3: indentada -->
    <g stroke="#3a3f4a" stroke-width="2">
      <line x1="72" y1="136" x2="110" y2="136"/>
      <line x1="114" y1="136" x2="122" y2="136"/>
      <line x1="126" y1="136" x2="190" y2="136"/>
    </g>
    <!-- Linha 4: função/def -->
    <g stroke="#2d7dd2" stroke-width="2">
      <line x1="56" y1="172" x2="105" y2="172"/>
      <line x1="109" y1="172" x2="117" y2="172"/>
      <line x1="121" y1="172" x2="165" y2="172"/>
    </g>
  </g>

  <!-- Cursor piscando (animado) -->
  <rect x="56" y="200" width="2" height="20" fill="url(#cursorGrad)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Ícone de código/parênteses no canto (accent) -->
  <g transform="translate(172, 36)" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)">
    <!-- Chaves estilizadas representando código -->
    <path d="M8 0 C4 0 0 4 0 8 C0 12 4 16 8 16 M16 8 C20 8 24 12 24 16 C24 20 20 24 16 24"/>
    <path d="M24 0 C28 0 32 4 32 8 C32 12 28 16 24 16 M16 24 C12 24 8 28 8 32 C8 36 12 40 16 40" transform="translate(0, -4)"/>
  </g>

  <!-- Pequeno detalhe: tag/label "P" sutil no canto inferior esquerdo -->
  <text x="48" y="220" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#accentGrad)" opacity="0.25" letter-spacing="-1">P</text>
</svg>