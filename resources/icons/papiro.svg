<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Fluent Design: Simple, geometric, monochromatic with accent color -->
  <!-- Background circle with accent color -->
  <circle cx="128" cy="128" r="120" fill="#0078D4"/>

  <!-- Document/Paper sheet - centered, clean geometric shape -->
  <g transform="translate(68, 56)">
    <!-- Paper base - rounded rectangle -->
    <rect x="0" y="0" width="120" height="144" rx="8" fill="white"/>

    <!-- Top folded corner - subtle detail -->
    <path d="M92 0 L120 0 L120 28 L92 0 Z" fill="#F3F3F3" stroke="#D1D1D1" stroke-width="1"/>

    <!-- Text lines representation - simple horizontal lines -->
    <g fill="#616161" opacity="0.6">
      <!-- Title line -->
      <rect x="16" y="24" width="88" height="4" rx="2"/>
      <!-- Code lines -->
      <rect x="16" y="44" width="72" height="3" rx="1.5"/>
      <rect x="16" y="54" width="92" height="3" rx="1.5"/>
      <rect x="16" y="64" width="60" height="3" rx="1.5"/>
      <rect x="16" y="74" width="80" height="3" rx="1.5"/>
      <rect x="16" y="84" width="100" height="3" rx="1.5"/>
      <rect x="16" y="94" width="52" height="3" rx="1.5"/>
      <!-- Cursor line - accent color -->
      <rect x="16" y="108" width="2" height="16" rx="1" fill="#0078D4" opacity="1"/>
      <rect x="16" y="118" width="40" height="3" rx="1.5"/>
      <rect x="16" y="128" width="28" height="3" rx="1.5"/>
    </g>
  </g>

  <!-- Small accent indicator at bottom-right -->
  <circle cx="188" cy="188" r="16" fill="#005A9E"/>
  <path d="M180 188 L186 194 L196 180" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>