<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper sheet -->
  <rect x="32" y="24" width="192" height="208" rx="8" fill="#ffffff" stroke="#b0b0b0" stroke-width="2"/>
  <!-- Paper fold/corner -->
  <path d="M184 24 L184 72 L224 24 Z" fill="#e8e8e8" stroke="#b0b0b0" stroke-width="2"/>
  <!-- Text lines -->
  <g stroke="#4a4a4a" stroke-width="2" stroke-linecap="round">
    <line x1="56" y1="64" x2="200" y2="64"/>
    <line x1="56" y1="100" x2="180" y2="100"/>
    <line x1="56" y1="136" x2="200" y2="136"/>
    <line x1="56" y1="172" x2="160" y2="172"/>
  </g>
  <!-- Cursor/caret -->
  <rect x="56" y="200" width="2" height="20" fill="#007acc">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Pen icon (top-right accent) -->
  <g transform="translate(180, 32)" fill="none" stroke="#007acc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 0 L24 8 L8 24 L0 16 Z"/>
