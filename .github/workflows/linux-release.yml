name: Linux Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            qt6-base-dev qt6-tools-dev libqt6printsupport6-dev \
            libhunspell-dev \
            linuxdeploy linuxdeploy-plugin-qt appimagetool \
            dpkg rpm lintian
          
      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -GNinja
      
      - name: Build
        run: cmake --build build --config Release -j$(nproc)
      
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      
      - name: Build DEB/RPM via CPack
        run: |
          cd build && cpack -G DEB -G RPM
      
      - name: Build AppImage
        run: |
          chmod +x packaging/linux/build-appimage.sh
          ./packaging/linux/build-appimage.sh
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.AppImage
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/*.deb
            build/*.rpm
            build/*.AppImage