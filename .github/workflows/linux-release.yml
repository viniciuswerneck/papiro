name: Linux Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-tools-dev qt6-translations-l10n \
            libhunspell-dev libgl1-mesa-dev libxkbcommon-dev \
            wget ca-certificates

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Install to AppDir
        run: cmake --install build --prefix AppDir/usr

      - name: Download linuxdeploy and linuxdeploy-plugin-qt
        run: |
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O linuxdeploy
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Build AppImage
        run: |
          ./linuxdeploy --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file resources/papiro.desktop \
            --icon-file resources/icons/papiro.png \
            --executable AppDir/usr/bin/Papiro

      - name: Build DEB and RPM
        run: |
          cd build && cpack -G DEB -G RPM

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            *.AppImage
            build/*.deb
            build/*.rpm

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            build/*.deb
            build/*.rpm
          generate_release_notes: true