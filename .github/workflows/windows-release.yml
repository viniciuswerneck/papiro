name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt 6.8.3 (MSVC)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          target: 'msvc2022_64'
          modules: 'qtprintsupport'
          cache: true
      
      - name: Install QtIFW
        run: |
          $url = "https://download.qt.io/official_releases/qt-installer-framework/4.6.0/qt-installer-framework-windows-x86_4.6.0.exe"
          Invoke-WebRequest -Uri $url -OutFile qtifw-installer.exe
          .\qtifw-installer.exe --script .github/scripts/qtifw-install.qs
          echo "C:\Qt\QtIFW-4.6.0\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G "Ninja" ^
            -DCMAKE_PREFIX_PATH="C:/Qt/6.8.3/msvc2022_64"
      
      - name: Build
        run: cmake --build build --config Release -j
      
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      
      - name: Build Installer + Portable
        run: |
          .\packaging\windows\build-installer.ps1
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            *.exe
            dist/Papiro-*-windows/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.exe
            dist/Papiro-*-windows/