name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+([0-9][0-9.]*)\s*$').Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Papiro $version"

      - name: Install Qt 6.8.3 MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install QtIFW 4.6
        run: |
          $qtifwUrl = "https://download.qt.io/official_releases/qt-installer-framework/4.6.1/QtInstallerFramework-windows-x64-4.6.1.exe"
          $qtifwInstaller = "qtifw-installer.exe"
          $qtifwScript = "$(Get-Location)\.github\scripts\qtifw-install.qs"
          $qtifwDir = "C:\Qt\QtIFW-4.6"

          Invoke-WebRequest -Uri $qtifwUrl -OutFile $qtifwInstaller
          & $qtifwInstaller --script $qtifwScript --verbose
          Remove-Item $qtifwInstaller

          "$qtifwDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build
          ctest --output-on-failure

      - name: Install to staging directory
        run: cmake --install build --prefix stage

      - name: Deploy Qt dependencies
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --no-openssl --no-angle --no-compiler-runtime --no-opengl-sw "stage\bin\Papiro.exe"

      - name: Build Portable ZIP
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "stage\*" -DestinationPath "dist\Papiro-${{ steps.version.outputs.version }}-windows-x64-portable.zip" -Force

      - name: Build QtIFW installer
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $config = "packaging/windows/qtifw/config/config.xml"
          $packages = "packaging/windows/qtifw/packages"
          $dataDir = Join-Path $packages "com.papiro.app/data"

          if (Test-Path $dataDir) { Remove-Item -Recurse -Force $dataDir }
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          Copy-Item -Path "stage\*" -Destination $dataDir -Recurse -Force

          Get-ChildItem -Path $packages -Filter "package.xml" -Recurse | ForEach-Object {
            (Get-Content $_.FullName -Raw) -replace '<Version>[^<]*</Version>', "<Version>$version</Version>" | Set-Content $_.FullName -NoNewline
          }
          (Get-Content $config -Raw) -replace '<Version>[^<]*</Version>', "<Version>$version</Version>" | Set-Content $config -NoNewline

          & "C:\Qt\QtIFW-4.6\bin\binarycreator.exe" --offline-only -c $config -p $packages "dist\Papiro-$version-windows-x64.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Papiro-*-windows-x64.exe
            dist/Papiro-*-windows-x64-portable.zip
          generate_release_notes: true
